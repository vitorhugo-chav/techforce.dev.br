<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechForce - Contato</title>
    <meta
      name="description"
      content="Entre em contato com Vitor Hugo, fundador da TechForce, para soluções em software e tecnologia."
    />
    <link
      rel="icon"
      href="img/techforce_logo_nobackground.png"
      type="image/png"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="no-js">
    <div id="particles-js"></div>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img
            src="img/techforce_logo_nobackground.png"
            alt="Logo Tech Force"
            class="logo img-fluid me-2"
            width="40"
            height="40"
          />
          <span class="fw-bold">TECHFORCE</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html#sobre">Sobre</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#projetos">Projetos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contatos.html">Contato</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-wrapper d-flex flex-column min-vh-100">
      <!-- Contato Section -->
      <section
        id="contato"
        class="flex-grow-1 d-flex align-items-center justify-content-center py-5"
      >
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 section-card">
              <h2 class="text-center mb-4">Fale comigo</h2>
              <form
                id="contact-form"
                action="https://formsubmit.co/vitor.hcf2021@protonmail.com"
                method="POST"
                autocomplete="off"
                novalidate
              >
                <div class="mb-3">
                  <label for="nome" class="form-label">Nome</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome"
                    required
                    aria-required="true"
                  />
                  <div class="invalid-feedback">
                    Por favor, informe seu nome.
                  </div>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">E-mail</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Seu e-mail"
                    required
                    aria-required="true"
                  />
                  <div class="invalid-feedback">Digite um e-mail válido.</div>
                </div>
                <div class="mb-3">
                  <label for="mensagem" class="form-label">Mensagem</label>
                  <textarea
                    class="form-control"
                    id="mensagem"
                    name="mensagem"
                    rows="3"
                    placeholder="Sua mensagem"
                    required
                    aria-required="true"
                  ></textarea>
                  <div class="invalid-feedback">Digite sua mensagem.</div>
                </div>
                <input type="hidden" name="_captcha" value="false" />
                <input type="hidden" name="hora_local" id="hora_local" />
                <button type="submit" class="btn btn-primary w-100">
                  <i class="fa fa-paper-plane me-2"></i>Enviar mensagem
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- Popup de agradecimento -->
      <div
        id="thankyou-popup"
        style="
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: #181a1b;
          color: #fff;
          padding: 2rem 3rem;
          border-radius: 16px;
          box-shadow: 0 4px 32px #000a;
          z-index: 9999;
          font-size: 1.3rem;
          text-align: center;
        "
      >
        Obrigado pelo contato! Em breve retornarei.
      </div>

      <!-- Footer -->
      <footer class="py-4 mt-auto">
        <div class="container text-center">
          <div class="social-icons mb-3 d-flex justify-content-center gap-4">
            <a
              href="https://wa.me/5566984329906"
              target="_blank"
              class="icon-link whatsapp"
              aria-label="WhatsApp"
              ><i class="fab fa-whatsapp"></i
            ></a>
            <a
              href="https://www.instagram.com/techforce.dev"
              target="_blank"
              class="icon-link instagram"
              aria-label="Instagram"
              ><i class="fab fa-instagram"></i
            ></a>
            <a
              href="https://github.com/vitorhugo-chav"
              target="_blank"
              class="icon-link github"
              aria-label="GitHub"
              ><i class="fab fa-github"></i
            ></a>
          </div>
          <div class="mb-2">
            <a href="index.html#sobre" class="footer-link me-3">Sobre</a>
            <a href="index.html#projetos" class="footer-link me-3">Projetos</a>
            <a href="contatos.html" class="footer-link">Contato</a>
          </div>
          <p class="mt-2 mb-0 copyright">
            &copy; 2025 Tech Force. Todos os direitos reservados. Desenvolvido
            por Vitor Hugo.
          </p>
        </div>
      </footer>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="js/particles-config.js"></script>
    <script src="js/main.js"></script>
    <script>
      // Validação visual do formulário
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("contact-form");
        if (form) {
          form.addEventListener(
            "submit",
            function (event) {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }
              form.classList.add("was-validated");
            },
            false
          );
        }
      });
    </script>
  </body>
</html>
